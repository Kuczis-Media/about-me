<!DOCTYPE html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <title>Quote of the day - Kuczi$</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../logo.png">
    <link rel="stylesheet" href="../../assets/css/main.css">
    <style>
      body {
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        background: #1b1f22;
        color: #f7f7f7;
        font-family: "Source Sans Pro", Arial, sans-serif;
        margin: 0;
        padding: 2rem;
      }
      .quote-app {
        max-width: 640px;
        width: 100%;
        background: rgba(24, 28, 31, 0.9);
        padding: 2.5rem;
        border-radius: 1.25rem;
        box-shadow: 0 1rem 2.5rem rgba(0, 0, 0, 0.35);
      }
      .quote-app h1 {
        margin-top: 0;
        text-align: center;
        font-size: 2rem;
        margin-bottom: 1.5rem;
      }
      blockquote {
        font-size: 1.25rem;
        line-height: 1.7;
        margin: 0;
        text-align: center;
      }
      .quote-translations {
        margin-top: 1.75rem;
      }
      .quote-translation {
        display: flex;
        gap: 0.5rem;
        justify-content: center;
        font-size: 0.95rem;
      }
      .quote-controls {
        margin-top: 2rem;
        display: flex;
        justify-content: center;
        gap: 1rem;
      }
      .quote-controls a,
      .quote-controls button {
        border: none;
        border-radius: 999px;
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        cursor: pointer;
        transition: transform 0.2s ease, box-shadow 0.2s ease;
      }
      .quote-controls button {
        background: #ff6b6b;
        color: #fff;
      }
      .quote-controls a {
        background: rgba(247, 247, 247, 0.1);
        color: #f7f7f7;
        text-decoration: none;
      }
      .quote-controls button:hover,
      .quote-controls a:hover {
        transform: translateY(-2px);
        box-shadow: 0 0.75rem 1.5rem rgba(0, 0, 0, 0.2);
      }
    </style>
      <style>
      .kuczi-credit {
        position: fixed;
        bottom: 12px;
        right: 12px;
        padding: 4px 12px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.55);
        color: #f8f8f8;
        font-family: inherit;
        font-size: 0.75rem;
        letter-spacing: 0.05em;
        text-decoration: none;
        opacity: 0.85;
        transition: opacity 0.2s ease, transform 0.2s ease;
        z-index: 9999;
      }
      .kuczi-credit:hover {
        opacity: 1;
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <div class="quote-app">
      <h1>Quote of the day</h1>
      <blockquote id="quoteContainer"></blockquote>
      <div id="quoteTranslations" class="quote-translations"></div>
      <div class="quote-controls">
        <button type="button" onclick="renderQuote()">Losuj cytat</button>
        <a href="../../index.html">Wróć na stronę główną</a>
      </div>
    </div>

    <script src="../../assets/js/cytaty.js"></script>
      <a class="kuczi-credit" href="/">© Kuczi$</a>
</body>
</html>
