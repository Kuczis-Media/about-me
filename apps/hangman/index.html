<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hangman - Kuczi$</title>
    <link rel="shortcut icon"  href="../logo.png">
    <link rel="stylesheet" href="style.css">
    <script src="scripts/word-list.js" defer></script>
    <script src="scripts/script.js" defer></script>
    <style>
      .kuczi-credit {
        position: fixed;
        bottom: 12px;
        right: 12px;
        padding: 4px 12px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.55);
        color: #f8f8f8;
        font-family: inherit;
        font-size: 0.75rem;
        letter-spacing: 0.05em;
        text-decoration: none;
        opacity: 0.85;
        transition: opacity 0.2s ease, transform 0.2s ease;
        z-index: 9999;
      }
      .kuczi-credit:hover {
        opacity: 1;
        transform: translateY(-1px);
      }
    </style>
  </head>
<body>
    <div class="game-modal">
        <div class="content">
            <img src="#" alt="gif">
            <h4>Game Over!</h4>
            <p>The correct word was: <b>rainbow</b></p>
            <button class="play-again">Play Again</button>
        </div>
    </div>
    <div class="container">
        <div class="hangman-box">
            <img src="#" draggable="false" alt="hangman-img">
            <h1>Hangman Game</h1>
        </div>
        <div class="game-box">
            <ul class="word-display"></ul>
            <h4 class="hint-text">Hint: <b></b></h4>
            <h4 class="guesses-text">Incorrect guesses: <b></b></h4>
            <div class="keyboard"></div>
        </div>
    </div>
    <a class="kuczi-credit" href="/">© Kuczi$</a>
</body>
</html>
