  <!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
		<link rel="shortcut icon"  href="../logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reminder - Kuczi$</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
    <style>
      .kuczi-credit {
        position: fixed;
        bottom: 12px;
        right: 12px;
        padding: 4px 12px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.55);
        color: #f8f8f8;
        font-family: inherit;
        font-size: 0.75rem;
        letter-spacing: 0.05em;
        text-decoration: none;
        opacity: 0.85;
        transition: opacity 0.2s ease, transform 0.2s ease;
        z-index: 9999;
      }
      .kuczi-credit:hover {
        opacity: 1;
        transform: translateY(-1px);
      }
    </style>
  </head>
<body>
  <div class="wrapper">
    <header>Zadania</header>
    <div class="inputField">
      <input type="text" placeholder="Dodaj zadanie.">
      <button><i class="fas fa-plus"></i></button>
    </div>
    <ul class="todoList">
      <!-- data are comes from local storage -->
    </ul>
    <div class="footer">
      <span>Masz <span class="pendingTasks"></span> zadań.</span>
      <button>Wyczyść Wszystkie</button>
    </div>
    &copy; <a class='credit' href="https://kuczisa.github.io/" target="_blank">Kuczis</a>
  </div>
  

  <script src="script.js"></script>

    <a class="kuczi-credit" href="/">© Kuczi$</a>
</body>
</html>
