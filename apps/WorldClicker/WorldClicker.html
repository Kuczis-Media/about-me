<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>World Clicker - Kuczi$</title>
    <link rel="shortcut icon" href="../logo.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
      <style>
      .kuczi-credit {
        position: fixed;
        bottom: 12px;
        right: 12px;
        padding: 4px 12px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.55);
        color: #f8f8f8;
        font-family: inherit;
        font-size: 0.75rem;
        letter-spacing: 0.05em;
        text-decoration: none;
        opacity: 0.85;
        transition: opacity 0.2s ease, transform 0.2s ease;
        z-index: 9999;
      }
      .kuczi-credit:hover {
        opacity: 1;
        transform: translateY(-1px);
      }
    </style>
  </head>
  <body>
    <h1 style="text-align: center;">World Clicker</h1>
    <h2>Play with the whole world — tap the button and share your score!</h2>
    <button class="button" id="clicky" onclick="intensive();">0</button>
    <p class="hint">Tip: keep this tab open to keep counting with your friends.</p>
    <a class="kuczi-credit" href="/">© Kuczi$</a>
</body>
</html>
