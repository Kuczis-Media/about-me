<!DOCTYPE html>


<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Tic Tac Toe- Kuczi$</title>
    <link rel="shortcut icon"  href="../logo.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"/>
    <style>
      .kuczi-credit {
        position: fixed;
        bottom: 12px;
        right: 12px;
        padding: 4px 12px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.55);
        color: #f8f8f8;
        font-family: inherit;
        font-size: 0.75rem;
        letter-spacing: 0.05em;
        text-decoration: none;
        opacity: 0.85;
        transition: opacity 0.2s ease, transform 0.2s ease;
        z-index: 9999;
      }
      .kuczi-credit:hover {
        opacity: 1;
        transform: translateY(-1px);
      }
    </style>
  </head>
<body>


  <div class="select-box">
    <header>Kółko i Krzyżyk</header>
    <div class="content">
      <div class="title">Wybierz, kim chcesz być?</div>
      <div class="options">
        <button class="playerX">Gracz (X)</button>
        <button class="playerO">Gracz (O)</button>
      </div>
      <div class="credit">&copy; <a href="https://kuczisa.github.io/" target="_blank">Kuczis</a></div>
    </div>
  </div> 



  <div class="play-board">
    <div class="details">
      <div class="players">
        <span class="Xturn">Gracz X</span>
        <span class="Oturn">Gracz O</span>
        <div class="slider"></div>
      </div>
    </div>
    <div class="play-area">
      <section>
        <span class="box1"></span>
        <span class="box2"></span>
        <span class="box3"></span>
      </section>
      <section>
        <span class="box4"></span>
        <span class="box5"></span>
        <span class="box6"></span>
      </section>
      <section>
        <span class="box7"></span>
        <span class="box8"></span>
        <span class="box9"></span>
      </section>
    </div>
  </div>

  <!-- result box -->
  <div class="result-box">
    <div class="won-text"></div>
    <div class="btn"><button>Rozpocznij od nowa</button></div>
  </div>

  <script src="script.js"></script>

    <a class="kuczi-credit" href="/">© Kuczi$</a>
</body>
</html>
